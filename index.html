<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <!-- Normalize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Font Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/pokedex.css">

    <!--Acicionando emojis-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    
    <section class="content">
        <header>
                <img src="./assets/img/logo.png" alt="Logo pokemon">
            <a href="https://github.com/DevElyShow"></a>
        </header>

        <ol id="pokemonList" class="pokemons">
            <!-- ..... Pokemons ..... -->
        </ol>

        <div class="pagination">
            <button id="loadMoreButton" type="button">
                Load More
            </button>
        </div>
            <!-- ..... Card Pokemons ..... -->
    <div id="pokemon-modal" class="modal">
    <div class="modal-content">
        <span class="close-button">&times;</span>
        <div class="modal-header">
            <h2 id="pokemon-name"></h2>
        </div>
        <div class="modal-detail">
            <div class="info">
                <p id="pokemon-weight"></p>
                <p id="pokemon-height"></p>
                <p id="pokemon-type"></p>
            </div>
            <img id="pokemon-photo" alt="Imagem do Pokémon" />
        </div>
    </div>
</div>

    <!-- JS -->
    <script src="/assets/js/pokemon-model.js"></script>
    <script src="/assets/js/poke-api.js"></script>
    <script src="/assets/js/main.js"></script>
    
  <!--Parte do Footer com so links-->
    <footer class="pokedex-footer">
      <div class="footer-container">
        <a href="https://github.com/DevElyShow/Pokedex" target="_blank" class="footer-btn">
          <i class="fab fa-github"></i>
          <span>Código</span>
        </a>
        <a href="https://www.linkedin.com/in/elydeivisoncesar/" target="_blank" class="footer-btn">
          <i class="fab fa-linkedin"></i>
          <span>LinkedIn</span>
        </a>
      </div>
    </footer>

</body>
</html>
</html>
</html>
